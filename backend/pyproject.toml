[project]
name = "osamu-dazai"
version = "0.1.0"
description = "Osamu Dazai — educational publishing engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy>=2.0.30",
    "python-docx>=1.1",
    "anthropic>=1.0",
    "httpx>=0.27",
    "resvg-py>=0.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osamu_dazai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
